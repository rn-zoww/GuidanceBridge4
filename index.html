/* ============================ PRIVATE JOURNAL / EVIDENCE LOCKER ============================ */
// Notes and screenshots are encrypted in this browser with AES-GCM before they are saved. The key is made from
// the student's passphrase (PBKDF2) and is only held in memory while the journal page is open, so nothing
// readable is stored and nobody else can open it. A counselor sees an entry only if the student shares it,
// which copies that one entry into the student's anonymous chat.
const JN = {
  ITER: 250000,
  slot: uid => 'gb_journal:' + uid,
  b64: u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); },
  u8: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)),
  load: uid => { try { return JSON.parse(localStorage.getItem(JN.slot(uid))); } catch(e){ return null; } },
  // Returns false when the browser refuses (storage full or blocked), so the page can say so instead of losing the entry.
  store: (uid, data) => { try { localStorage.setItem(JN.slot(uid), JSON.stringify(data)); return true; } catch(e){ return false; } },
  async key(pass, salt, iter){
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt, iterations:iter}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
  },
  async seal(key, bytes){ const iv = crypto.getRandomValues(new Uint8Array(12)); return {iv:JN.b64(iv), ct:JN.b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes)))}; },
  async open(key, x){ return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:JN.u8(x.iv)}, key, JN.u8(x.ct))); },
  sealJSON: (key, o) => JN.seal(key, new TextEncoder().encode(JSON.stringify(o))),
  openJSON: async (key, x) => JSON.parse(new TextDecoder().decode(await JN.open(key, x))),
  // Screenshots are scaled down and saved as JPEG so a handful of them fit in the browser's storage.
  async shrink(file){
    const bmp = await createImageBitmap(file), k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k));
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .75));
    return new Uint8Array(await blob.arrayBuffer());
  },
  url: bytes => 'data:image/jpeg;base64,' + JN.b64(bytes)
};

R.journal = () => {
  const uid = studentId();
  // Decrypted entries and the key live in these variables only, and are dropped when the student leaves the page.
  let key = null, data = null, entries = [], shot = null;
  cleanup = () => { key = null; data = null; entries = []; shot = null; };
  const page = inner => { app.innerHTML = `<div class="narrow page-pad"><span class="eyebrow"><i></i> Private journal</span>${inner}</div>${footer()}`; };
  const err = m => { const e = $('#j-err'); e.innerHTML = m ? `<div class="err" role="alert">${esc(m)}</div>` : ''; if (m) e.scrollIntoView({behavior:'smooth', block:'center'}); };
  const FULL = 'This browser has no storage space left for the journal. Delete an older entry or screenshot and try again.';
  if (!(window.crypto && crypto.subtle)) {
    page(`<h1 class="page-h1">Your private journal</h1><div class="form-card"><p style="margin:0">The journal encrypts everything you write, and this browser only allows that on a secure (https) connection. Please open GuidanceBridge through its normal web address and try again.</p></div>`);
    return;
  }

  // Locked: create a passphrase the first time, or enter it to open the journal.
  function gate(){
    key = null; entries = []; shot = null;
    data = JN.load(uid);
    const fresh = !data;
    page(`<h1 class="page-h1">Your private journal</h1>
      <p class="lead" style="font-size:1.05rem">Write down what happened and keep screenshots as evidence. Each entry is saved with its date and time, and locked with a passphrase only you know.</p>
      <form class="form-card" id="j-gate" novalidate>
        <div id="j-err"></div>
        ${fresh ? `<ul class="j-facts">
          <li><span class="ci">${ICON.lock}</span><span><b>Encrypted on this device.</b> Entries never leave this browser, and counselors cannot see them.</span></li>
          <li><span class="ci">${ICON.clock}</span><span><b>Time-stamped automatically.</b> A clear record helps if you decide to ask for help later.</span></li>
          <li><span class="ci">${ICON.share}</span><span><b>Shared only if you choose.</b> You can send a single entry to a counselor through your anonymous chat.</span></li>
        </ul>` : ''}
        <div class="field"><label class="f" for="j-pass">${fresh ? 'Create a passphrase' : 'Passphrase'}</label><input id="j-pass" type="password" autocomplete="${fresh ? 'new' : 'current'}-password" required>${fresh ? '<div class="hint">At least 6 characters. A short sentence is easy to remember.</div>' : ''}</div>
        ${fresh ? '<div class="field"><label class="f" for="j-pass2">Type it again</label><input id="j-pass2" type="password" autocomplete="new-password" required></div>' : ''}
        <button class="btn btn-primary btn-block" type="submit" id="j-go">${fresh ? 'Create my journal' : 'Unlock journal'}</button>
        ${fresh ? '<p class="fine">There is no “forgot passphrase”. Without it, nobody can open the journal, not even a counselor.</p>'
                : '<p class="switch">Forgot it? <button type="button" class="linkbtn" id="j-reset">Erase this journal and start over</button></p>'}
      </form>`);
    if (!fresh) $('#j-reset').onclick = () => {
      if (!confirm('Erase the whole journal on this device? Every entry and screenshot in it will be deleted. This cannot be undone.')) return;
      try { localStorage.removeItem(JN.slot(uid)); } catch(e){}
      toast('Journal erased'); gate();
    };
    $('#j-gate').addEventListener('submit', async e => {
      e.preventDefault();
      const pass = $('#j-pass').value, btn = $('#j-go');
      if (fresh && pass.length < 6) return err('The passphrase needs at least 6 characters.');
      if (fresh && pass !== $('#j-pass2').value) return err('The two passphrases do not match.');
      if (!pass) return err('Please enter your passphrase.');
      btn.disabled = true; err('');
      try {
        if (fresh) {
          const salt = crypto.getRandomValues(new Uint8Array(16));
          const k = await JN.key(pass, salt, JN.ITER);
          const d = {v:1, salt:JN.b64(salt), iter:JN.ITER, check:await JN.sealJSON(k, {ok:1}), entries:[]};
          if (!JN.store(uid, d)) { btn.disabled = false; return err('This browser would not save the journal. Check that it is not in private browsing mode.'); }
          key = k; data = d;
        } else {
          const k = await JN.key(pass, JN.u8(data.salt), data.iter);
          try { await JN.openJSON(k, data.check); } catch(x){ btn.disabled = false; return err('That passphrase does not match. Please try again.'); }
          const list = [];
          for (const s of data.entries) list.push({...await JN.openJSON(k, s.body), id:s.id, img:s.img ? JN.url(await JN.open(k, s.img)) : ''});
          key = k; entries = list;
        }
      } catch(x){ btn.disabled = false; return err('The journal could not be opened in this browser.'); }
      if (location.hash.slice(2).split('?')[0] === 'journal') locker();
    });
  }

  // Unlocked: add an entry, and read, share or delete saved ones.
  function locker(){
    page(`<div class="j-head"><h1 class="page-h1">Your private journal</h1><button class="btn btn-outline btn-sm" id="j-lock" type="button">Lock journal</button></div>
      <p class="muted" style="margin-bottom:24px">Unlocked on this device only. It locks again when you leave this page.</p>
      <form class="form-card" id="j-form" novalidate>
        <div id="j-err"></div>
        <div class="row2">
          <div class="field"><label class="f" for="j-title">Title <span class="opt">(optional)</span></label><input id="j-title" type="text" maxlength="80" placeholder="e.g. Group chat, Monday"></div>
          <div class="field"><label class="f" for="j-when">When it happened <span class="opt">(optional)</span></label><input id="j-when" type="datetime-local"></div>
        </div>
        <div class="field"><label class="f" for="j-text">What happened?</label><textarea id="j-text" rows="5" maxlength="4000" placeholder="Write it in your own words. You don't need to name anyone."></textarea></div>
        <div class="field j-pick">
          <input class="sr" type="file" id="j-file" accept="image/*"><label class="btn btn-outline btn-sm" for="j-file">Add a screenshot or photo</label>
          <span class="hint" id="j-fname">Optional. One image per entry.</span>
          <div class="j-preview" id="j-preview" hidden></div>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="j-save">Save to journal</button>
        <p class="fine">The date and time are added for you. This is your own record, not a formal report.</p>
      </form>
      <div class="j-list" id="j-list"></div>`);
    $('#j-when').max = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    $('#j-lock').onclick = () => { gate(); toast('Journal locked'); };
    const clearShot = () => { shot = null; $('#j-file').value = ''; $('#j-preview').hidden = true; $('#j-preview').innerHTML = ''; $('#j-fname').textContent = 'Optional. One image per entry.'; };
    $('#j-file').addEventListener('change', async e => {
      const file = e.target.files[0]; if (!file) return;
      err('');
      if (!file.type.startsWith('image/') || file.size > 15 * 1024 * 1024) { clearShot(); return err('Please choose an image file smaller than 15 MB.'); }
      try { shot = await JN.shrink(file); } catch(x){ clearShot(); return err('That image could not be read. Try a PNG or JPEG screenshot.'); }
      if (!$('#j-preview')) return;
      $('#j-fname').textContent = file.name;
      $('#j-preview').innerHTML = `<img src="${JN.url(shot)}" alt="Screenshot to be saved"><button type="button" class="linkbtn" id="j-unpick">Remove image</button>`;
      $('#j-preview').hidden = false;
      $('#j-unpick').onclick = clearShot;
    });
    $('#j-form').addEventListener('submit', async e => {
      e.preventDefault();
      const title = $('#j-title').value.trim(), text = $('#j-text').value.trim(), when = Date.parse($('#j-when').value) || 0;
      if (!text && !shot) return err('Write a note or add a screenshot first.');
      if (when > Date.now() + 60000) return err('“When it happened” cannot be in the future.');
      const btn = $('#j-save'); btn.disabled = true; err('');
      const body = {title, text, when, at:Date.now(), shared:0}, id = 'j' + body.at;
      const saved = {id, body:await JN.sealJSON(key, body)};
      if (shot) saved.img = await JN.seal(key, shot);
      data.entries.unshift(saved);
      if (!JN.store(uid, data)) { data.entries.shift(); btn.disabled = false; return err(FULL); }
      entries.unshift({...body, id, img:shot ? JN.url(shot) : ''});
      e.target.reset(); clearShot(); btn.disabled = false;
      draw(); toast('Saved to your journal');
    });
    $('#j-list').addEventListener('click', async e => {
      const img = e.target.closest('.j-img'); if (img) return img.classList.toggle('big');
      const b = e.target.closest('button[data-act]'); if (!b) return;
      const x = entries.find(y => y.id === b.dataset.id), i = data.entries.findIndex(y => y.id === b.dataset.id);
      if (!x || i < 0) return;
      if (b.dataset.act === 'del') {
        if (!confirm('Delete this journal entry? This cannot be undone.' + (x.shared ? '\n\nThe copy you shared with a counselor stays in your chat.' : ''))) return;
        const [gone] = data.entries.splice(i, 1);
        if (!JN.store(uid, data)) { data.entries.splice(i, 0, gone); return toast('Could not delete the entry'); }
        entries.splice(entries.indexOf(x), 1); draw(); toast('Entry deleted');
      } else {

function deleteItem(kind, id){
  const list = kind === 'a' ? db.appts : db.threads, x = list.find(y => y.id === id); if (!x) return false;

    $('#auth-toggle').onclick = () => { reg = !reg; draw(); $('#a-user').focus(); };
    $('#auth-form').addEventListener('submit', async e => {
      e.preventDefault();
      const err = m => { $('#auth-err').innerHTML = `<div class="err" role="alert">${esc(m)}</div>`; $('#auth-go').disabled = false; };
      const n = $('#a-user').value.trim().toLowerCase(), pw = $('#a-pw').value;
      if (n.length < 3) return err('Username needs at least 3 characters.');
      if (pw.length < 6) return err('Password needs at least 6 characters.');
      $('#auth-go').disabled = true;
      const p = await hash(pw);
      let u = db.users.find(x => x.name === n && x.role === role);
      if (reg) {
        if (u) return err('That username is taken. Try another.');
        if (adm && $('#a-code').value.trim() !== CONFIG.STAFF_CODE) return err('Staff access code is not valid.');
        u = {id:'u' + Date.now(), role, name:n, pw:p}; db.users.push(u); save();
      } else if (!u || u.pw !== p) return err('Username or password is incorrect.');
      SS.set('gb_me', u.id);
      const nx = jparse(SS.get('gb_next'), null); SS.del('gb_next');
      go(nx && nx.role === role && nx.h ? nx.h : (adm ? '#/dashboard' : '#/chat'));
    });
  };
  draw();
}
R.login = () => auth('student');
R.admin = () => auth('admin');
R.out = () => { SS.del('gb_me'); go('#/'); };

/* ============================ ROUTER + BOOT ============================ */
const TITLES = {home:'UPHSD Guidance Services', chat:'Talk to the assistant', appointment:'Book a counselor', portal:'Anonymous chat', journal:'Private journal', dashboard:'Triage dashboard', request:'Appointment request', thread:'Anonymous chat (counselor)', login:'Student sign in', admin:'Counselor portal'};
// Students and counselors get separate experiences: separate menus, footers and pages.
const STUDENT_VIEWS = ['home', 'chat', 'appointment', 'portal', 'journal', 'login'];
const isStaff = () => { const u = me(); return !!u && u.role === 'admin'; };
function renderNav(p){
  const u = me(), staff = isStaff();
  if (p === 'request' || p === 'thread') p = 'dashboard';
  const a = ([k, l]) => `<a href="#/${k}"${p === k ? ' class="on" aria-current="page"' : ''}>${l}</a>`;
  const links = staff
    ? a(['dashboard', 'Triage dashboard']) + `<a href="#/out">Sign out (${esc(u.name)})</a>`
    : [['chat','AI chat'], ['appointment','Book a counselor'], ['portal','Anonymous chat'], ['journal','Private journal']].map(a).join('')
      + '<a href="#/" id="nav-contact">Contact us</a>'
      + (u ? `<a href="#/out">Sign out (${esc(u.name)})</a>` : '');
  $('#nav').innerHTML = `
    <a class="logo" href="#/${staff ? 'dashboard' : ''}" aria-label="GuidanceBridge ${staff ? 'counselor dashboard' : 'home'}, University of Perpetual Help System DALTA">${LOGO(48)}<span>GuidanceBridge<small class="hm-brandsub">${staff ? 'UPHSD DALTA • Counselor portal' : 'UPHSD DALTA • Guidance Services'}</small></span></a>
    <button class="menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">${ICON.menu}</button>
    <nav class="nav-links" id="nav-links" aria-label="Main">${links}</nav>`;
  $('#menu-btn').onclick = () => { const o = $('#nav-links').classList.toggle('open'); $('#menu-btn').setAttribute('aria-expanded', o); };
  const c = $('#nav-contact');
  if (c) c.onclick = e => {
    e.preventDefault(); $('#nav-links').classList.remove('open'); $('#menu-btn').setAttribute('aria-expanded', 'false');
    const f = $('#contact');
    if (f) f.scrollIntoView({behavior:'smooth'}); else { SS.set('gb_scroll', 'contact'); go('#/'); }
  };
}
function route(){
  if (cleanup) { try { cleanup(); } catch(e){} cleanup = null; }
  live = null;
  const p = (location.hash.slice(2) || 'home').split('?')[0];
  let view = R[p] ? p : 'home';
  // A signed-in counselor never lands on student pages; students can't reach the dashboard (need('admin') guards it).
  if (isStaff() && (STUDENT_VIEWS.includes(view) || view === 'admin')) { go('#/dashboard'); return; }
  const staffArea = isStaff() || ['admin', 'dashboard', 'request', 'thread'].includes(view);
  document.body.classList.toggle('staff', staffArea);
  $('.hm-top').innerHTML = staffArea
    ? 'Counselor portal · <b>Every request is confidential.</b> Students appear only by alias or nickname.'
    : 'A gentle reminder: <b>you deserve to feel safe, heard, and supported.</b>';
  document.body.classList.toggle('full', view === 'chat');
  document.documentElement.classList.toggle('full-root', view === 'chat');
  fitViewport();
  closeWidget();
  renderNav(view);
  document.title = 'GuidanceBridge | ' + (TITLES[view] || TITLES.home);
  R[view]();
  app.classList.remove('page-in'); void app.offsetWidth; app.classList.add('page-in');
  animateIn(); onScroll();
  const sc = SS.get('gb_scroll'); SS.del('gb_scroll');
  if (sc && $('#' + sc)) setTimeout(() => $('#' + sc).scrollIntoView({behavior:'smooth'}), 50); else jumpTop();
}
// Size the full-page chat to the area the user can actually see. Mobile 100vh includes space behind the
// browser toolbars, and iOS does not shrink the layout when the keyboard opens; visualViewport accounts for both.
function fitViewport(){
  const vv = window.visualViewport, root = document.documentElement.style;
  root.setProperty('--vvh', Math.round(vv ? vv.height : window.innerHeight) + 'px');
  root.setProperty('--vvt', Math.round(vv ? vv.offsetTop : 0) + 'px');
  if (document.body.classList.contains('full')) { const b = $('.chat-full .chat-body'); if (b) b.scrollTop = b.scrollHeight; }
}
if (window.visualViewport) { visualViewport.addEventListener('resize', fitViewport); visualViewport.addEventListener('scroll', fitViewport); }
addEventListener('resize', fitViewport);
addEventListener('orientationchange', () => setTimeout(fitViewport, 300));
/* scroll reveals, count-up numbers and reading progress (skipped for users who prefer reduced motion) */
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el){
  const end = +el.dataset.count, suf = el.dataset.suffix || '';
  if (reduced) { el.textContent = end + suf; return; }
  const t0 = performance.now(), dur = 1400;
  const f = now => { const p = Math.min(1, (now - t0) / dur); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))) + suf; if (p < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
const io = !reduced && 'IntersectionObserver' in window ? new IntersectionObserver(entries => entries.forEach(e => {
  if (!e.isIntersecting) return;
  e.target.classList.add('in'); if (e.target.dataset.count) countUp(e.target); io.unobserve(e.target);
}), {threshold:.15, rootMargin:'0px 0px -40px 0px'}) : null;
function animateIn(){
  $$('.reveal', app).forEach(el => {
    el.style.setProperty('--i', [...el.parentElement.children].filter(c => c.classList.contains('reveal')).indexOf(el));
    if (io) io.observe(el); else el.classList.add('in');
  });
  $$('[data-count]', app).forEach(el => io ? io.observe(el) : countUp(el));
}
/* Smooth wheel scrolling (desktop mouse wheels only). Eases the page toward the wheel target instead of
   jumping in steps. Inner scroll areas (chat windows, menus, the video row) keep native scrolling. */
const smooth = (() => {
  let target = 0, cur = 0, raf = 0;
  const off = reduced || !matchMedia('(pointer:fine)').matches;
  const maxY = () => document.documentElement.scrollHeight - innerHeight;
  const innerScroller = el => {
    for (; el && el !== document.body && el !== document.documentElement; el = el.parentElement) {
      const oy = getComputedStyle(el).overflowY;
      if ((oy === 'auto' || oy === 'scroll') && el.scrollHeight > el.clientHeight + 1) return true;
    }
    return false;
  };
  const step = () => {
    cur += (target - cur) * 0.14;
    if (Math.abs(target - cur) < 0.6) cur = target;
    window.scrollTo({top:cur, behavior:'instant'});
    raf = cur === target ? 0 : requestAnimationFrame(step);
  };
  const stop = () => { if (raf) cancelAnimationFrame(raf); raf = 0; };
  if (!off) addEventListener('wheel', e => {
    const b = document.body.classList;
    if (e.ctrlKey || e.deltaX && Math.abs(e.deltaX) > Math.abs(e.deltaY) || b.contains('full') || b.contains('wopen') || innerScroller(e.target)) return;
    e.preventDefault();
    if (!raf) target = cur = scrollY;               // resync after keyboard/scrollbar/anchor scrolling
    const dy = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
    target = Math.max(0, Math.min(maxY(), target + dy));
    if (!raf) raf = requestAnimationFrame(step);
  }, {passive:false});
  return {stop};
})();
const jumpTop = () => { smooth.stop(); window.scrollTo({top:0, left:0, behavior:'instant'}); };
// Close the mobile menu when tapping anywhere outside it.
document.addEventListener('click', e => {
  const n = $('#nav-links'); if (!n || !n.classList.contains('open') || e.target.closest('#nav-links, #menu-btn')) return;
  n.classList.remove('open'); $('#menu-btn').setAttribute('aria-expanded', 'false');
});
const progress = document.createElement('div'); progress.id = 'progress'; progress.setAttribute('aria-hidden', 'true'); document.body.prepend(progress);
function onScroll(){ const h = document.documentElement.scrollHeight - innerHeight; progress.style.transform = `scaleX(${h > 0 ? Math.min(1, scrollY / h) : 0})`; }
addEventListener('scroll', onScroll, {passive:true});
// Links to a section of the student home page (e.g. the breathing exercise) from any page.
document.addEventListener('click', e => {
  const l = e.target.closest('a[data-home]'); if (!l) return;
  e.preventDefault(); const id = l.dataset.home, el = $('#' + id);
  if (el) el.scrollIntoView({behavior:'smooth'}); else { SS.set('gb_scroll', id); go('#/'); }
});
addEventListener('hashchange', route);
addEventListener('storage', e => { if (e.key === KEY) { db = jparse(e.newValue, db); live && live(); } });
buildWidget();
(async () => {
  if (!db.users.some(u => u.role === 'admin')) { db.users.push({id:'c1', role:'admin', name:'counselor', pw:await hash('counselor123')}); save(); }
  if (!db.seeded) { seedDemo(await hash('student123')); db.seeded = 1; save(); }
  route();
})();
